import json
from datetime import datetime

from app.agents.llm import LLMClient
from app.domain.models import Market


def _to_dict(item) -> dict:
    if item is None:
        return {}
    if isinstance(item, dict):
        return item
    if hasattr(item, "model_dump"):
        return item.model_dump()
    if hasattr(item, "dict"):
        return item.dict()
    return {"value": str(item)}


class EventDrivenTrader:
    def __init__(self):
        self.llm = LLMClient()

    async def generate_decision(self, symbol, market, structured_data, news_items, portfolio_state) -> dict:
        tech = structured_data.get("technicals", {})
        price = structured_data.get("price", {})
        news_dicts = [_to_dict(n) for n in news_items]

        news_text = "\n".join([
            f"- [{n.get('source', 'unknown')}] {n.get('title', '')}: {str(n.get('summary', ''))[:200]}"
            for n in news_dicts[:10]
        ])

        prompt = f"""
你是事件驅動交易代理。根據以下多模態信息，對 {market.value}:{symbol} 生成交易決策。

=== 結構化市場數據 ===
最新價格: {price.get('last', 'N/A')}
日漲跌幅: {price.get('change_pct', 'N/A')}%
成交量: {price.get('volume', 'N/A')}
RSI(14): {tech.get('RSI', 'N/A')}
MACD: {tech.get('MACD', 'N/A')}
MA20: {tech.get('MA20', 'N/A')}
MA50: {tech.get('MA50', 'N/A')}

=== 非結構化新聞 ===
{news_text}

=== 當前持倉 ===
{json.dumps(portfolio_state, ensure_ascii=False, default=str)[:2000]}

請只輸出 JSON：
{{
  "action": "BUY/HOLD/SELL/AVOID",
  "confidence": 0-1,
  "position_size_pct": 0-0.3,
  "entry_price": 價格或null,
  "stop_loss": 價格或null,
  "take_profit": 價格或null,
  "key_catalyst": "驅動此決策的關鍵事件",
  "news_impact": "POSITIVE/NEGATIVE/NEUTRAL",
  "reasoning": "完整推理過程"
}}
"""
        text = await self.llm.chat([{"role": "user", "content": prompt}])

        try:
            decision = json.loads(text)
        except Exception:
            decision = {"action": "HOLD", "confidence": 0.3,
                        "position_size_pct": 0, "reasoning": text[:500]}

        decision["timestamp"] = datetime.now().isoformat()
        decision["symbol"] = symbol
        decision["market"] = market.value
        return decision

    async def batch_event_scan(self, symbols, market, data_provider):
        results = []
        today = datetime.now().strftime("%Y-%m-%d")

        for sym in symbols:
            try:
                bars = await data_provider.get_bars(sym, market, "2025-01-01", today)
                news = await data_provider.get_news(sym, market, limit=5)

                if bars is None or len(bars) == 0:
                    continue

                close = bars["close"]
                tech = {
                    "RSI": self._calc_rsi(close),
                    "MACD": self._calc_macd(close),
                    "MA20": float(close.rolling(20).mean().iloc[-1]),
                    "MA50": float(close.rolling(50).mean().iloc[-1]),
                }
                structured = {
                    "price": {
                        "last": float(close.iloc[-1]),
                        "change_pct": round(float(close.pct_change().iloc[-1] * 100), 2),
                        "volume": float(bars["volume"].iloc[-1]),
                    },
                    "technicals": tech,
                }

                news_dicts = [_to_dict(n) for n in news]
                decision = await self.generate_decision(sym, market, structured, news_dicts, {})
                results.append(decision)
            except Exception as e:
                results.append({"symbol": sym, "error": str(e)})

        return sorted(results, key=lambda x: x.get("confidence", 0), reverse=True)

    def _calc_rsi(self, close, n=14):
        delta = close.diff()
        gain = delta.clip(lower=0).rolling(n).mean()
        loss = (-delta.clip(upper=0)).rolling(n).mean()
        rs = gain / (loss + 1e-9)
        return round(float(100 - 100 / (1 + rs).iloc[-1]), 2)

    def _calc_macd(self, close):
        ema12 = close.ewm(span=12).mean()
        ema26 = close.ewm(span=26).mean()
        return round(float((ema12 - ema26).iloc[-1]), 4)
```

from app.agents.debate import DebateEngine

from app.agents.manager import PortfolioManagerAgent
from app.agents.risk import RiskAgent
from app.data.composite import CompositeProvider

class InvestmentOrchestrator:

        self.data = CompositeProvider()
        self.debate = DebateEngine()
        self.risk = RiskAgent()
        self.manager = PortfolioManagerAgent()
        self.event_trader = EventDrivenTrader()

    async def analyze(self, symbol, market, start, end,
                      use_event_driven=True, use_memory=True) -> dict:
        bars = await self.data.get_bars(symbol, market, start, end)
        fundamentals = await self.data.get_fundamentals(symbol, market)
        news = await self.data.get_news(symbol, market, limit=20)

        context = {
            "bars_tail": (bars.tail(60).to_dict("records")
                          if bars is not None and not bars.empty else []),
            "fundamentals": fundamentals,
            "news": [_to_dict(n) for n in news],
        }

        # 因子層（可選）
        try:
            from app.factors.registry import FactorRegistry
            from app.backtest.signal_dsl import SignalDSL
            if bars is not None and not bars.empty:
                registry = FactorRegistry()
                production = registry.get_production_factors(market.value)
                if production:
                    dsl = SignalDSL(bars)
                    factor_values = {}
                    for f in production[:20]:
                        try:
                            score = dsl.evaluate(f["expr"])
                            factor_values[f["name"]] = float(score.iloc[-1])
                        except Exception:
                            continue
                    context["active_factors"] = factor_values
        except Exception as e:
            context["factor_error"] = str(e)

        # 台股籌碼 / 美股期權（可選）
        try:
            if market == Market.TW and bars is not None and not bars.empty:
                from app.factors.tw_chips import TWChipsFactorEngine
                chips = TWChipsFactorEngine().compute_factors(symbol, start, end)
                if chips is not None and not chips.empty:
                    context["chip_factors"] = chips.tail(20).to_dict("records")
            if market == Market.US:
                from app.factors.us_options import USOptionsFactorEngine
                context["option_factors"] = USOptionsFactorEngine().compute_factors(symbol)
        except Exception as e:
            context["extra_factor_error"] = str(e)

        # 記憶層（可選）
        if use_memory:
            try:
                from app.memory.trade_memory import TradeMemoryLayer
                memory = TradeMemoryLayer()
                context["similar_trades"] = memory.recall_similar_trades(symbol=symbol, limit=5)
                context["discipline_drift"] = memory.get_discipline_drift()
            except Exception as e:
                context["memory_error"] = str(e)

        # 多分析師
        analysts = build_analysts(market)
        reports = []
        for agent in analysts:
            try:
                reports.append(await agent.analyze(symbol, market, context))
            except Exception as e:
                from app.domain.models import AnalystReport
                reports.append(AnalystReport(
                    role=agent.role, symbol=symbol, market=market,
                    summary=f"分析失敗: {e}", score=0.0,
                    key_points=[], risks=[str(e)],
                ))

        # 辯論
        try:
            debate = await self.debate.run(symbol, reports)
        except Exception as e:
            from app.domain.models import DebateResult
            debate = DebateResult(bull_case=f"辯論失敗: {e}", bear_case="", rounds=[])

        # 風控
        try:
            risk = await self.risk.review(symbol, debate)
        except Exception as e:
            from app.domain.models import RiskReview
            risk = RiskReview(max_position_pct=0.1, stop_loss_pct=0.08,
                              take_profit_pct=0.2, approved=False,
                              notes=f"風控失敗: {e}")

        # 事件驅動
        event_decision = None
        if use_event_driven and bars is not None and not bars.empty:
            try:
                structured = self._build_structured(bars)
                event_decision = await self.event_trader.generate_decision(
                    symbol, market, structured,
                    [_to_dict(n) for n in news], {},
                )
                context["event_driven_decision"] = event_decision
            except Exception as e:
                event_decision = {"error": str(e)}

        # 最終決策
        try:
            decision = await self.manager.decide(symbol, market, reports, debate, risk)
        except Exception as e:
            from app.domain.models import FinalDecision
            decision = FinalDecision(
                symbol=symbol, market=market, action="HOLD",
                confidence=0.0, target_position_pct=0.0,
                thesis=f"經理決策失敗: {e}",
                reports=reports, debate=debate, risk=risk,
            )

        result = decision.model_dump() if hasattr(decision, "model_dump") else decision
        result["event_driven"] = event_decision
        return result

    def _build_structured(self, bars) -> dict:
        close = bars["close"]
        return {
            "price": {
                "last": float(close.iloc[-1]),
                "change_pct": round(float(close.pct_change().iloc[-1] * 100), 2),
                "volume": float(bars["volume"].iloc[-1]),
            },
            "technicals": {
                "RSI": self._rsi(close), "MACD": self._macd(close),
                "MA20": float(close.rolling(20).mean().iloc[-1]),

    def _rsi(self, close, n=14):

  "limit_price": 限價（可選）,
  "reasoning": "解析理由"
}}
"""
        response = await self.llm.chat([{"role": "user", "content": prompt}])
        try:
            intent = json.loads(response)
        except Exception:
            intent = {"action": "HOLD", "reasoning": response[:300]}

        intent["portfolio_value"] = portfolio_context.get("portfolio_value", 1_000_000)
        intent["current_position_value"] = portfolio_context.get("current_position_value", 0)
        intent["current_equity"] = portfolio_context.get("current_equity", 1_000_000)

        self.audit_log.append({
            "timestamp": datetime.now().isoformat(),
            "input": text, "intent": intent, "stage": "parsed",
        })
        return intent

    async def execute(self, intent, risk_guard, broker_tw, broker_us, dry_run=True) -> dict:
        action = intent.get("action", "HOLD")

        if action == "HOLD":
            return {"executed": False, "reason": "no action needed"}

        if action == "CANCEL_ALL":
            self.audit_log.append({
                "timestamp": datetime.now().isoformat(),
                "action": "CANCEL_ALL", "stage": "executed",
            })
            return {"executed": True, "action": "CANCEL_ALL"}

        check = risk_guard.check_order(
            symbol=intent.get("symbol", ""), side=action,
            qty=intent.get("qty", 0),
            price=intent.get("limit_price", 0) or 0,
            portfolio_value=intent["portfolio_value"],
            current_position_value=intent["current_position_value"],
            current_equity=intent["current_equity"],
        )

        if not check["approved"]:
            self.audit_log.append({
                "timestamp": datetime.now().isoformat(),
                "intent": intent, "risk_check": check, "stage": "blocked",
            })
            return {"executed": False, "reason": check["reason"]}

        adjusted_qty = check.get("adjusted_qty", intent.get("qty", 0))

        if dry_run:
            self.audit_log.append({
                "timestamp": datetime.now().isoformat(),
                "intent": intent, "adjusted_qty": adjusted_qty, "stage": "dry_run",
            })
            return {"executed": False, "dry_run": True,
                    "intent": intent, "adjusted_qty": adjusted_qty}

        market = Market(intent.get("market", "TW"))
        side = Side(action)

        if market == Market.TW:
            result = broker_tw.place_order(
                intent["symbol"], side, intent.get("limit_price", 0), adjusted_qty,
            )
        else:
            result = broker_us.place_order(
                intent["symbol"], side, adjusted_qty,
                intent.get("order_type", "MKT"), intent.get("limit_price"),
            )

        self.audit_log.append({
            "timestamp": datetime.now().isoformat(),
            "intent": intent, "result": result, "stage": "executed",
        })
        return {"executed": True, "result": result}

    def get_audit_log(self, limit: int = 100) -> list[dict]:
        return self.audit_log[-limit:]

**職責**：組合優化，支援 HRP / 風險平價 / 最大分散化 / 均值-風險，含 skfolio 與 numpy 雙實現。

```python
import numpy as np
import pandas as pd

from app.data.warehouse import MarketWarehouse


class PortfolioOptimizer:
    def __init__(self):
        self.warehouse = MarketWarehouse()
        self._skfolio_available = self._check_skfolio()

    def _check_skfolio(self) -> bool:
        try:
            import skfolio  # noqa: F401
            return True
        except ImportError:
            return False

    def load_returns(self, symbols, market, start, end) -> pd.DataFrame:
        frames = {}
        for sym in symbols:
            bars = self.warehouse.query_bars(sym, market, start, end)
            if bars is None or bars.empty:
                continue
            bars = bars.set_index("timestamp").sort_index()
            frames[sym] = bars["close"].pct_change()
        if not frames:
            return pd.DataFrame()
        return pd.DataFrame(frames).dropna(how="all").fillna(0)

    def optimize(self, returns, method="hrp", risk_measure="cvar", max_weight=0.3) -> dict:
        if returns.empty or len(returns.columns) < 2:
            return {"error": "need at least 2 assets"}
        if self._skfolio_available:
            try:
                return self._optimize_skfolio(returns, method, risk_measure, max_weight)
            except Exception as e:
                print(f"skfolio failed, fallback to numpy: {e}")
        return self._optimize_numpy(returns, method, max_weight)

    def _optimize_skfolio(self, returns, method, risk_measure, max_weight) -> dict:
        from skfolio.optimization import (
            MeanRisk, HierarchicalRiskParity, RiskBudgeting, MaximumDiversification,
        )
        from skfolio.risk_measures import CVaR, Variance

        if method == "hrp":
            model = HierarchicalRiskParity()
        elif method == "risk_budgeting":
            model = RiskBudgeting()
        elif method == "max_diversification":
            model = MaximumDiversification()
        elif method == "mean_risk":
            rm = CVaR() if risk_measure == "cvar" else Variance()
            model = MeanRisk(risk_measure=rm, max_weights=max_weight)
        else:
            model = HierarchicalRiskParity()

        model.fit(returns)
        weights = np.asarray(model.weights_)
        return self._summarize(returns, weights, method)

    def _optimize_numpy(self, returns, method, max_weight) -> dict:
        n = len(returns.columns)
        if method == "hrp":
            weights = self._hrp_numpy(returns)
        elif method == "risk_budgeting":
            weights = self._risk_parity_numpy(returns)
        elif method == "max_diversification":
            weights = self._max_div_numpy(returns)
        else:
            weights = self._equal_weight(n)

        weights = np.minimum(weights, max_weight)
        weights = weights / (weights.sum() + 1e-9)
        return self._summarize(returns, weights, f"{method}_numpy")

    def _hrp_numpy(self, returns) -> np.ndarray:
        cov = returns.cov().values
        n = cov.shape[0]
        std = np.sqrt(np.diag(cov))
        corr = cov / (np.outer(std, std) + 1e-9)
        dist = np.sqrt(np.clip((1 - corr) / 2, 0, 1))

        from scipy.cluster.hierarchy import linkage, leaves_list
        from scipy.spatial.distance import squareform

        condensed = squareform(dist, checks=False)
        link = linkage(condensed, method="single")
        order = leaves_list(link)

        weights = np.ones(n)
        clusters = [list(order)]

        while clusters:
            new_clusters = []
            for cluster in clusters:
                if len(cluster) <= 1:
                    continue
                mid = len(cluster) // 2
                left, right = cluster[:mid], cluster[mid:]

                var_left = self._cluster_var(cov, left)
                var_right = self._cluster_var(cov, right)
                total = var_left + var_right + 1e-9
                alpha = 1 - var_left / total

                for i in left:
                    weights[i] *= alpha
                for i in right:
                    weights[i] *= (1 - alpha)

                new_clusters.extend([left, right])
            clusters = new_clusters

        return weights / (weights.sum() + 1e-9)

    def _cluster_var(self, cov, indices) -> float:
        sub = cov[np.ix_(indices, indices)]
        w = np.ones(len(indices)) / len(indices)
        return float(w @ sub @ w)

    def _risk_parity_numpy(self, returns) -> np.ndarray:
        cov = returns.cov().values
        n = cov.shape[0]
        w = np.ones(n) / n

        for _ in range(200):
            marginal = cov @ w
            rc = w * marginal
            target = rc.mean()
            w = w * (target / (rc + 1e-9))
            w = w / (w.sum() + 1e-9)
        return w

    def _max_div_numpy(self, returns) -> np.ndarray:
        cov = returns.cov().values
        vols = np.sqrt(np.diag(cov))
        inv_vol = 1 / (vols + 1e-9)
        w = inv_vol / inv_vol.sum()

        for _ in range(50):
            marginal = cov @ w
            grad = vols / (np.sqrt(w @ cov @ w) + 1e-9) - marginal
            w = w + 0.01 * grad
            w = np.maximum(w, 1e-6)
            w = w / w.sum()
        return w

    def _equal_weight(self, n) -> np.ndarray:
        return np.ones(n) / n

    def _summarize(self, returns, weights, method) -> dict:
        portfolio_ret = (returns * weights).sum(axis=1)
        cum_ret = (1 + portfolio_ret).cumprod()

        sharpe = float(portfolio_ret.mean() / (portfolio_ret.std() + 1e-9) * (252 ** 0.5))
        max_dd = float(((cum_ret / cum_ret.cummax()) - 1).min())

        return {
            "method": method,
            "weights": {col: round(float(w), 4)
                        for col, w in zip(returns.columns, weights)},
            "metrics": {
                "sharpe": round(sharpe, 4),
                "total_return": round(float(cum_ret.iloc[-1] - 1), 4),
                "max_drawdown": round(max_dd, 4),
                "annual_volatility": round(float(portfolio_ret.std() * (252 ** 0.5)), 4),
            },
        }

import json

class ReasoningEngine:
    def __init__(self):
        self.llm = LLMClient()

    async def filter_order(self, symbol, side, qty, price, market_context, risk_state) -> dict:
        prompt = f"""
你是執行層推理引擎。判斷以下訂單是否應該執行。

訂單：{side} {symbol} x{qty} @ {price}
市場狀態：{market_context.get('regime', 'unknown')}
當前回撤：{risk_state.get('current_drawdown', 0):.2%}
單日盈虧：{risk_state.get('daily_pnl', 0):.2%}

請只輸出 JSON：
{{
  "decision": "APPROVE/REJECT/MODIFY",
  "reason": "理由",
  "adjusted_qty": 數量,
  "urgency": "HIGH/MEDIUM/LOW"
}}
"""
        try:
            text = await self.llm.chat([{"role": "user", "content": prompt}])
        except Exception as e:
            return {"decision": "APPROVE", "reason": f"LLM 失敗，默認通過: {e}",
                    "adjusted_qty": qty, "urgency": "MEDIUM"}

        data = self._extract_json(text)
        if data is None:
            return {"decision": "APPROVE", "reason": f"解析失敗，默認通過: {text[:200]}",
                    "adjusted_qty": qty, "urgency": "MEDIUM"}

        if "adjusted_qty" not in data:
            data["adjusted_qty"] = qty
        return data

    @staticmethod
    def _extract_json(text: str):
        if not text:
            return None
        try:
            return json.loads(text)
        except Exception:
            pass
        import re
        m = re.search(r"```(?:json)?\s*(\{.*?\})\s*```", text, re.DOTALL)
        if m:
            try:
                return json.loads(m.group(1))
            except Exception:
                pass
        start, end = text.find("{"), text.rfind("}")
        if start != -1 and end > start:
            try:
                return json.loads(text[start:end + 1])
            except Exception:
                pass
        return None


class MarketRegimeDetector:
    @staticmethod
    def detect(bars: pd.DataFrame, lookback: int = 60) -> dict:
        if bars is None or bars.empty or len(bars) < lookback:
            return {"regime": "unknown", "volatility": 0.0,
                    "trend": 0.0, "recommended_position_scale": 0.5}

        close = bars["close"].tail(lookback)
        returns = close.pct_change().dropna()

        vol = float(returns.std() * np.sqrt(252))
        vol_median = float(returns.rolling(max(lookback // 2, 2)).std().median() * np.sqrt(252))

        ma20 = close.rolling(20).mean().iloc[-1]
        ma60 = close.rolling(60).mean().iloc[-1] if len(close) >= 60 else ma20
        trend = float((ma20 - ma60) / (ma60 + 1e-9))

        is_high_vol = vol > vol_median * 1.3 if vol_median > 0 else False

        if abs(trend) < 0.02:
            regime = "sideways"
        elif trend > 0:
            regime = "high_vol_bull" if is_high_vol else "low_vol_bull"
        else:
            regime = "high_vol_bear" if is_high_vol else "low_vol_bear"

        return {
            "regime": regime,
            "volatility": round(vol, 4),
            "trend": round(trend, 4),
            "recommended_position_scale": (
                0.5 if "high_vol" in regime
                else 0.7 if regime == "sideways"
                else 1.0
            ),
        }

```python
import hashlib
import json
from datetime import datetime
from pathlib import Path


class VerifiableAuditLog:
    def __init__(self, log_path: str = "./data_lake/audit/events.jsonl"):
        self.log_path = Path(log_path)
        self.log_path.parent.mkdir(parents=True, exist_ok=True)
        self._prev_hash = self._load_last_hash()

    def _load_last_hash(self) -> str:
        if not self.log_path.exists():
            return "0" * 64
        last_hash = "0" * 64
        with open(self.log_path) as f:
            for line in f:
                try:
                    record = json.loads(line)
                    last_hash = record.get("hash", last_hash)
                except Exception:
                    continue
        return last_hash

    def append(self, event_type: str, data: dict) -> dict:
        event = {
            "timestamp": datetime.utcnow().isoformat(),
            "event_type": event_type, "data": data,
            "prev_hash": self._prev_hash,
        }
        canonical = json.dumps(event, sort_keys=True, default=str)
        event["hash"] = hashlib.sha256(canonical.encode()).hexdigest()

        with open(self.log_path, "a") as f:
            f.write(json.dumps(event, default=str) + "\n")

        self._prev_hash = event["hash"]
        return event

    def log_decision(self, symbol, action, reasoning, signal_sources):
        return self.append("TRADE_DECISION", {
            "symbol": symbol, "action": action,
            "reasoning": reasoning, "signal_sources": signal_sources,
        })

    def log_order(self, order_id, symbol, side, qty, price, status):
        return self.append("ORDER_EVENT", {
            "order_id": order_id, "symbol": symbol, "side": side,
            "qty": qty, "price": price, "status": status,
        })

    def log_risk_check(self, symbol, approved, reason):
        return self.append("RISK_CHECK", {
            "symbol": symbol, "approved": approved, "reason": reason,
        })

    def build_merkle_root(self, start_idx: int = 0, end_idx: int | None = None) -> str:
        hashes = []
        with open(self.log_path) as f:
            for i, line in enumerate(f):
                if i < start_idx:
                    continue
                if end_idx and i >= end_idx:
                    break
                try:
                    hashes.append(json.loads(line).get("hash", ""))
                except Exception:
                    continue

        if not hashes:
            return "0" * 64

        while len(hashes) > 1:
            if len(hashes) % 2 == 1:
                hashes.append(hashes[-1])
            hashes = [
                hashlib.sha256((hashes[i] + hashes[i + 1]).encode()).hexdigest()
                for i in range(0, len(hashes), 2)
            ]
        return hashes[0]

    def verify_integrity(self) -> dict:
        prev_hash = "0" * 64
        errors = []
        count = 0

        if not self.log_path.exists():
            return {"total_records": 0, "errors": 0, "valid": True, "error_details": []}

        with open(self.log_path) as f:
            for i, line in enumerate(f):
                line = line.strip()
                if not line:
                    continue
                try:
                    record = json.loads(line)
                except Exception:
                    errors.append({"line": i, "error": "json parse failed"})
                    continue

                if record.get("prev_hash") != prev_hash:
                    errors.append({"line": i, "error": "hash chain broken",
                                   "expected": prev_hash,
                                   "actual": record.get("prev_hash")})

                actual_hash = record.get("hash")
                check = {k: v for k, v in record.items() if k != "hash"}
                canonical = json.dumps(check, sort_keys=True, default=str)
                expected_hash = hashlib.sha256(canonical.encode()).hexdigest()

                if actual_hash != expected_hash:
                    errors.append({"line": i, "error": "hash mismatch",
                                   "expected": expected_hash,
                                   "actual": actual_hash})

                prev_hash = actual_hash or prev_hash
                count += 1

        return {"total_records": count, "errors": len(errors),
                "valid": len(errors) == 0, "error_details": errors[:10]}
```

import asyncio
import functools
import threading
import time
from datetime import datetime


class TradingWatchdog:
    def __init__(self, alert_urls: list[str] | None = None):
        self.alert_urls = alert_urls or []
        self._watchdogs: dict[str, datetime] = {}
        self._watchdog_started: set[str] = set()
        self._ops = None
        self._lock = threading.Lock()

    def _fire_alert(self, name: str, elapsed: float):
        msg = f"[CRITICAL] {name} 已 {elapsed:.0f} 秒無心跳。時間：{datetime.now().isoformat()}"
        print(msg)
        if self._ops:
            try:
                self._ops.fire_critical(msg)
            except Exception:
                pass

    def monitor(self, name: str, timeout_seconds: float = 30.0):
        def decorator(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                with self._lock:
                    self._watchdogs[name] = datetime.now()

                if name not in self._watchdog_started:
                    self._watchdog_started.add(name)

                    def watchdog_loop():
                        while True:
                            time.sleep(timeout_seconds / 2)
                            with self._lock:
                                last = self._watchdogs.get(name)
                            if last:
                                elapsed = (datetime.now() - last).total_seconds()
                                if elapsed > timeout_seconds:
                                    self._fire_alert(name, elapsed)

                    t = threading.Thread(target=watchdog_loop, daemon=True)
                    t.start()

                return func(*args, **kwargs)
            return wrapper
        return decorator

    def instrument_async(self, name: str, timeout_seconds: float = 30.0):
        def decorator(func):
            @functools.wraps(func)
            async def wrapper(*args, **kwargs):
                self._watchdogs[name] = datetime.now()

                if name not in self._watchdog_started:
                    self._watchdog_started.add(name)

                    async def watchdog_loop():
                        while True:
                            await asyncio.sleep(timeout_seconds / 2)
                            last = self._watchdogs.get(name)
                            if last:
                                elapsed = (datetime.now() - last).total_seconds()
                                if elapsed > timeout_seconds:
                                    self._fire_alert(name, elapsed)

                    asyncio.create_task(watchdog_loop())

                return await func(*args, **kwargs)
            return wrapper
        return decorator

**職責**：研究紀律層，排列檢驗 + 多重檢驗校正。

```python
import numpy as np


class ResearchRigor:
    def __init__(self, min_samples: int = 30):
        self.min_samples = min_samples
        self.test_ledger: list[dict] = []

    def permutation_test(self, factor_values, forward_returns,
                         n_permutations=1000, alternative="two-sided") -> dict:
        valid = ~(np.isnan(factor_values) | np.isnan(forward_returns))
        f = factor_values[valid]
        r = forward_returns[valid]

        n = len(f)
        if n < self.min_samples:
            return {"test": "permutation", "status": "INSUFFICIENT_SAMPLES",
                    "n": n, "min_required": self.min_samples}

        from scipy.stats import spearmanr
        actual_ic, _ = spearmanr(f, r)

        perm_ics = np.zeros(n_permutations)
        for i in range(n_permutations):
            perm_r = np.random.permutation(r)
            perm_ic, _ = spearmanr(f, perm_r)
            perm_ics[i] = perm_ic

        if alternative == "two-sided":
            p_value = np.mean(np.abs(perm_ics) >= np.abs(actual_ic))
        elif alternative == "greater":
            p_value = np.mean(perm_ics >= actual_ic)
        else:
            p_value = np.mean(perm_ics <= actual_ic)

        result = {
            "test": "permutation",
            "actual_ic": round(float(actual_ic), 6),
            "perm_mean": round(float(np.mean(perm_ics)), 6),
            "perm_std": round(float(np.std(perm_ics)), 6),
            "p_value": round(float(p_value), 6),
            "n_samples": n, "n_permutations": n_permutations,
            "significant": bool(p_value < 0.05),
        }
        self.test_ledger.append(result)
        return result

    def multiple_testing_correction(self, method: str = "bh") -> dict:
        if not self.test_ledger:
            return {"error": "no tests in ledger"}

        p_values = [t["p_value"] for t in self.test_ledger if "p_value" in t]
        n_tests = len(p_values)
        if n_tests == 0:
            return {"error": "no valid p-values"}

        if method == "bonferroni":
            corrected = [min(p * n_tests, 1.0) for p in p_values]
        elif method == "bh":
            sorted_idx = np.argsort(p_values)
            sorted_p = np.array(p_values)[sorted_idx]
            corrected_sorted = sorted_p * n_tests / (np.arange(n_tests) + 1)
            corrected_sorted = np.minimum.accumulate(corrected_sorted[::-1])[::-1]
            corrected = np.zeros(n_tests)
            corrected[sorted_idx] = corrected_sorted
        else:
            corrected = p_values

        results = []
        for i, t in enumerate(self.test_ledger):
            if "p_value" not in t:
                continue
            results.append({
                "factor": t.get("factor", f"test_{i}"),
                "raw_p": t["p_value"],
                "corrected_p": round(float(corrected[i]), 6),
                "significant_after_correction": bool(corrected[i] < 0.05),
            })

        return {"method": method, "n_tests": n_tests, "results": results,
                "bonferroni_threshold": 0.05 / n_tests}

    def full_report(self, factor_name, factor_values, forward_returns) -> dict:
        perm = self.permutation_test(factor_values, forward_returns)
        correction = self.multiple_testing_correction()
        return {
            "factor": factor_name,
            "permutation_test": perm,
            "multiple_testing": correction,
            "verdict": "SIGNIFICANT" if perm.get("significant") else "NOT_SIGNIFICANT",
        }
```

## 9.4 `app/memory/trade_memory.py`

**職責**：Agent 交易記憶層，五層記憶系統。

```python
import hashlib
import json
from datetime import datetime
from pathlib import Path

import duckdb


class TradeMemoryLayer:
    def __init__(self, db_path: str = "./data_lake/memory.duckdb"):
        self.db_path = db_path
        Path(db_path).parent.mkdir(parents=True, exist_ok=True)
        self._ensure_tables()

    def _conn(self):
        return duckdb.connect(self.db_path)

    def _ensure_tables(self):
        with self._conn() as con:
            con.execute("""
                CREATE TABLE IF NOT EXISTS episodic_memory (
                    trade_id VARCHAR, symbol VARCHAR, market VARCHAR, side VARCHAR,
                    entry_price DOUBLE, exit_price DOUBLE, qty INTEGER, pnl DOUBLE,
                    entry_reason TEXT, market_regime VARCHAR, confidence DOUBLE,
                    agent_signals TEXT,
                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                );
            """)
            con.execute("""
                CREATE UNIQUE INDEX IF NOT EXISTS idx_episodic_trade_id
                ON episodic_memory (trade_id);
            """)
            con.execute("""
                CREATE TABLE IF NOT EXISTS procedural_memory (
                    metric_name VARCHAR, metric_value DOUBLE, sample_size INTEGER,
                    last_updated TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                );
            """)
            con.execute("""
                CREATE UNIQUE INDEX IF NOT EXISTS idx_procedural_metric
                ON procedural_memory (metric_name);
            """)
            con.execute("""
                CREATE TABLE IF NOT EXISTS affective_memory (
                    date DATE, avg_confidence DOUBLE,
                    win_streak INTEGER, lose_streak INTEGER,
                    max_drawdown_today DOUBLE, discipline_drift_score DOUBLE
                );
            """)
            con.execute("""
                CREATE UNIQUE INDEX IF NOT EXISTS idx_affective_date
                ON affective_memory (date);
            """)

    def record_trade(self, symbol, market, side, entry_price, exit_price,
                     qty, entry_reason, market_regime="unknown",
                     confidence=0.5, agent_signals=None) -> dict:
        pnl = ((exit_price - entry_price) * qty if side == "BUY"
               else (entry_price - exit_price) * qty)
        trade_id = hashlib.sha256(
            f"{symbol}_{datetime.utcnow().isoformat()}".encode()
        ).hexdigest()[:16]

        with self._conn() as con:
            con.execute("""
                INSERT INTO episodic_memory
                (trade_id, symbol, market, side, entry_price, exit_price,
                 qty, pnl, entry_reason, market_regime, confidence, agent_signals)
                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            """, [trade_id, symbol, market, side, entry_price, exit_price,
                  qty, pnl, entry_reason, market_regime, confidence,
                  json.dumps(agent_signals or {})])

        self._reflect(trade_id)
        return {"trade_id": trade_id, "pnl": pnl}

    def _reflect(self, trade_id):
        with self._conn() as con:
            trade = con.execute(
                "SELECT * FROM episodic_memory WHERE trade_id = ?", [trade_id]
            ).fetchone()
        if trade:
            self._update_procedural(trade)
            self._update_affective(trade)

    def _update_procedural(self, trade):
        symbol = trade[1]
        with self._conn() as con:
            row = con.execute(
                "SELECT metric_value, sample_size FROM procedural_memory WHERE metric_name = ?",
                [f"trade_count_{symbol}"],
            ).fetchone()

            if row:
                new_val = (row[0] * row[1] + 1.0) / (row[1] + 1)
                con.execute("""
                    UPDATE procedural_memory
                    SET metric_value = ?, sample_size = ?, last_updated = CURRENT_TIMESTAMP
                    WHERE metric_name = ?
                """, [new_val, row[1] + 1, f"trade_count_{symbol}"])
            else:
                con.execute("""
                    INSERT INTO procedural_memory (metric_name, metric_value, sample_size)
                    VALUES (?, ?, ?)
                """, [f"trade_count_{symbol}", 1.0, 1])

    def _update_affective(self, trade):
        pnl = trade[7]
        today = datetime.utcnow().date()
        with self._conn() as con:
            existing = con.execute(
                "SELECT * FROM affective_memory WHERE date = ?", [today]
            ).fetchone()

            if existing:
                new_win = existing[2] + 1 if pnl > 0 else 0
                new_lose = existing[3] + 1 if pnl < 0 else 0
                con.execute("""
                    UPDATE affective_memory
                    SET win_streak = ?, lose_streak = ?,
                        avg_confidence = (avg_confidence + ?) / 2
                    WHERE date = ?
                """, [new_win, new_lose, trade[10], today])
            else:
                con.execute("""
                    INSERT INTO affective_memory
                    (date, avg_confidence, win_streak, lose_streak)
                    VALUES (?, ?, ?, ?)
                """, [today, trade[10], 1 if pnl > 0 else 0, 1 if pnl < 0 else 0])

    def recall_similar_trades(self, symbol=None, market_regime=None, limit=10) -> list[dict]:
        sql = "SELECT *, ABS(pnl) AS outcome_weight FROM episodic_memory WHERE 1=1"
        params = []
        if symbol:
            sql += " AND symbol = ?"
            params.append(symbol)
        if market_regime:
            sql += " AND market_regime = ?"
            params.append(market_regime)
        sql += " ORDER BY outcome_weight DESC LIMIT ?"
        params.append(limit)

        with self._conn() as con:
            df = con.execute(sql, params).df()
        return df.to_dict("records")

    def get_discipline_drift(self, lookback_days: int = 30) -> dict:
        with self._conn() as con:
            recent = con.execute("""
                SELECT AVG(confidence) as avg_conf, COUNT(*) as n
                FROM episodic_memory
                WHERE created_at > CURRENT_TIMESTAMP - INTERVAL ? DAY
            """, [lookback_days]).fetchone()

            historical = con.execute("""
                SELECT AVG(confidence) as avg_conf
                FROM episodic_memory
                WHERE created_at <= CURRENT_TIMESTAMP - INTERVAL ? DAY
            """, [lookback_days]).fetchone()

        if not recent or not historical or historical[0] is None:
            return {"drift_score": 0, "status": "insufficient_data"}

        drift = abs(recent[0] - historical[0]) if recent[0] else 0
        return {
            "recent_avg_confidence": round(recent[0], 4) if recent[0] else None,
            "historical_avg_confidence": round(historical[0], 4),
            "drift_score": round(drift, 4),
            "status": "warning" if drift > 0.2 else "normal",
        }
```

import numpy as np

from fastapi import FastAPI, HTTPException

from app.agents.orchestrator import InvestmentOrchestrator
from app.agents.nl_trader import NLTrader
from app.backtest.engine import BacktestEngine
from app.backtest.signal_dsl import SignalDSL
from app.data.composite import CompositeProvider
from app.domain.models import Market, Side
from app.markets.registry import get_rules
from app.risk.guard import build_tw_guard, build_us_guard

app = FastAPI(title="TW/US Invest OS")

orchestrator = InvestmentOrchestrator()
data_provider = CompositeProvider()
_nl_trader = NLTrader()
_risk_tw = build_tw_guard()
_risk_us = build_us_guard()


class AnalyzeReq(BaseModel):
    symbol: str
    market: Market
    start: str = "2024-01-01"
    end: str = "2025-01-01"


class BacktestReq(BaseModel):
    symbol: str
    market: Market
    start: str
    end: str
    expr: str = "ema(close, 10) / ema(close, 30) - 1"
    upper: float = 0.02
    lower: float = -0.02


@app.get("/health")
def health():
    return {"ok": True, "app": "TW/US Invest OS"}


@app.get("/rules/{market}")
def rules(market: Market):
    r = get_rules(market)
    return {"market": market.value, "settlement_days": r.settlement_days,
            "price_limit_pct": r.price_limit_pct, "lot_size": r.lot_size}


@app.post("/analyze")
async def analyze(req: AnalyzeReq):
    return await orchestrator.analyze(req.symbol, req.market, req.start, req.end)


@app.post("/backtest")
async def backtest(req: BacktestReq):
    bars = await data_provider.get_bars(req.symbol, req.market, req.start, req.end)
    if bars is None or bars.empty:
        raise HTTPException(status_code=404, detail="no data")

    dsl = SignalDSL(bars)
    score = dsl.evaluate(req.expr)
    signals = dsl.discretize(score, req.upper, req.lower)

    engine = BacktestEngine(market=req.market)
    result = engine.run(bars, signals)

    eq = pd.DataFrame(result["equity_curve"])
    if not eq.empty:
        eq["return"] = eq["equity"].pct_change()
        sharpe = (eq["return"].mean() / (eq["return"].std() + 1e-9)) * (252 ** 0.5)
        total_return = eq["equity"].iloc[-1] / eq["equity"].iloc[0] - 1
        max_dd = ((eq["equity"] / eq["equity"].cummax()) - 1).min()
    else:
        sharpe = total_return = max_dd = 0

    result["metrics"] = {
        "sharpe": round(float(sharpe), 4),
        "total_return": round(float(total_return), 4),
        "max_drawdown": round(float(max_dd), 4),
        "num_trades": len(result["trades"]),
    }
    return result


@app.post("/trade/order-protected")
async def place_order_protected(
    symbol: str, market: Market, side: Side,
    price: float, qty: int, portfolio_value: float,
    current_position_value: float = 0.0,
    current_equity: float = 1_000_000.0,
    dry_run: bool = True,
):
    guard = _risk_tw if market == Market.TW else _risk_us
    check = guard.check_order(symbol, side.value, qty, price,
                              portfolio_value, current_position_value, current_equity)

    if not check["approved"]:
        return {"blocked": True, "reason": check["reason"]}

    adjusted_qty = check.get("adjusted_qty", qty)

    if dry_run:
        return {"dry_run": True, "symbol": symbol, "side": side.value,
                "original_qty": qty, "adjusted_qty": adjusted_qty,
                "reason": check["reason"]}

    return {"dry_run": False, "message": "broker integration not enabled",
            "adjusted_qty": adjusted_qty}


@app.post("/trade/natural")

## 四、常見錯誤排除

### 4.1 安裝類

#### 錯誤：`ModuleNotFoundError: No module named 'app'`

**原因**：從錯誤的目錄執行，或沒設定 `PYTHONPATH`。

**解法**：
```bash
cd invest-os  # 專案根目錄
python scripts/smoke_test.py
```

所有腳本都有 `sys.path.insert(0, ROOT)`，從專案根目錄執行即可。

#### 錯誤：`ImportError: cannot import name 'FinMind'`

**解法**：
```bash
pip install FinMind
```

#### 錯誤：`ModuleNotFoundError: No module named 'shioaji'`

**解法**：
```bash
pip install shioaji
```

#### 錯誤：`ModuleNotFoundError: No module named 'duckdb'`

**解法**：
```bash
pip install duckdb>=1.0.0
```

---

### 4.2 數據類

#### 錯誤：`FinMind login failed`

**原因**：Token 過期或未設定。

**解法**：
1. 到 https://finmindtrade.com/ 申請免費 token
2. 在 `.env` 加入 `FINMIND_TOKEN=your_token`
3. 重啟服務

**注意**：無 token 也能抓部分數據，只是配額較低。

#### 錯誤：`yfinance fetch error: No data found`

**原因**：
- 標的代碼錯誤
- 網路問題
- Yahoo Finance 臨時故障

**解法**：
```bash
# 測試 yfinance 是否正常
python -c "import yfinance as yf; print(yf.Ticker('AAPL').history(period='5d'))"
```

#### 錯誤：`no data` (404)

**原因**：該標的在指定時間範圍內無數據。

**解法**：
1. 確認標的代碼格式：
   - 台股：`2330`（4 位數字）
   - 美股：`AAPL`（大寫）
2. 確認時間範圍合理（避免未來日期）

#### 錯誤：`insufficient data (N bars)`

**原因**：數據量不足以計算指標。

**解法**：至少需要 60 筆數據。如果標的剛上市，改用其他標的。

---

### 4.3 回測類

#### 錯誤：`DSL eval error: name 'xxx' is not defined`

**原因**：表達式用了 DSL 不支援的函數。

**解法**：檢查 DSL 支援的函數列表：
```
sma, ema, mean, std, stdev, rsi, atr, zscore,
highest, lowest, max, min, slope,
delay, delta, ts_rank, ts_argmax, ts_argmin,
ts_sum, ts_mean, ts_std, ts_min, ts_max,
rank, sign, abs, log, correlation, covariance,
quantile, signedpower, rsquare, residual
```

#### 錯誤：`DSL eval error: invalid syntax`

**原因**：表達式語法錯誤。

**解法**：常見問題：
- ❌ `ema(close, 10) - ema(close, 30) / ema(close, 30)`（運算優先級）
- ✅ `(ema(close, 10) - ema(close, 30)) / ema(close, 30)`
- ❌ `close > 100`（不支援布林運算）
- ✅ `sign(close - 100)`

#### 錯誤：回測結果 `num_trades: 0`

**原因**：信號從未觸發。

**解法**：
1. 檢查 `upper` / `lower` 閾值是否過嚴
2. 用 `--upper 0.01 --lower -0.01` 放寬
3. 用 `--expr "close / delay(close, 20) - 1"` 測試簡單策略

---

### 4.4 風控類

#### 錯誤：`KILL_SWITCH_ACTIVE`

**原因**：Kill Switch 被觸發過。

**解法**：
```bash
# 重新啟動服務（記憶體狀態重置）
# 或刪除狀態檔案
rm data_lake/risk_state_tw.json
```

#### 錯誤：`CIRCUIT_BREAKER_KILL`

**原因**：回撤超過 15%，觸發熔斷。

**解法**：等待冷卻時間（預設 60 分鐘），或調整 `circuit_breaker_levels`。

#### 錯誤：`POSITION_LIMIT_xx%`

**原因**：單一倉位超過上限。

**解法**：風控會自動減倉（回傳 `adjusted_qty`），不需要手動處理。

---

### 4.5 審計類

#### 錯誤：`audit verification failed`

**原因**：審計日誌被手動修改。

**解法**：
```bash
# 檢查損壞位置
python -c "
from app.audit.verifiable_log import VerifiableAuditLog
log = VerifiableAuditLog()
print(log.verify_integrity())
"
```

如果日誌損壞，只能刪除重建：
```bash
rm data_lake/audit/events.jsonl
```

---

### 4.6 Shioaji 類

#### 錯誤：`login failed`

**原因**：帳號或密碼錯誤。

**解法**：
1. 確認 `.env` 中的 `SHIOAJI_PERSON_ID` 和 `SHIOAJI_PASSWORD`
2. 模擬帳號可從 https://www.sinotrade.com.tw/shioaji/ 申請

#### 錯誤：`contract not found`

**原因**：股票代碼不在合約清單。

**解法**：
```python
# 列出可用合約
import shioaji as sj
api = sj.Shioaji(simulation=True)
api.login(person_id="...", passwd="...")
print(list(api.Contracts.Stocks.TSE.keys())[:20])
```

#### 錯誤：`ca not activated`（實盤）

**原因**：實盤需要 CA 憑證。

**解法**：
1. 到永豐申請 CA
2. 下載 `.pfx` 檔案
3. 在 `.env` 設定 `CA_PATH` 和 `CA_PASSWORD`
4. 修改 `ShioajiBridge(simulation=False, ca_path="...", ca_passwd="...")`

---

### 4.7 監控類

#### 錯誤：`[CRITICAL] xxx 已 60 秒無心跳`

**原因**：某個模組停止回應。

**解法**：
1. 檢查對應模組的日誌
2. 如果是 WebSocket 斷線，重啟服務
3. 調整 timeout：`watchdog.monitor("xxx", timeout_seconds=120)`

---

### 4.8 效能類

#### 問題：回測很慢

**解法**：
1. 縮短時間範圍
2. 減少標的數量
3. 使用 `NeutrinoEngine`（Numba 加速）
4. 安裝 `numba`：`pip install numba`

#### 問題：DuckDB 鎖定

**原因**：多個 process 同時寫入。

**解法**：
- DuckDB 是單寫入者模型
- 讀寫分離：讀用 `read_only=True`，寫入排隊
- 或用 `PostgreSQL` 替代（需自行擴展）

## 1.4 `frontend/utils/api_client.py`

```python
"""FastAPI 客戶端封裝。"""

import os
from typing import Any

import pandas as pd
import requests
import streamlit as st


API_BASE = os.getenv("API_BASE_URL", "http://127.0.0.1:8000")
TIMEOUT = 60


class APIError(Exception):
    pass


def _handle_response(r: requests.Response) -> Any:
    if r.status_code >= 400:
        try:
            detail = r.json().get("detail", r.text)
        except Exception:
            detail = r.text
        raise APIError(f"HTTP {r.status_code}: {detail}")
    try:
        return r.json()
    except Exception:
        return r.text


@st.cache_data(ttl=30, show_spinner=False)
def health_check() -> dict:
    try:
        r = requests.get(f"{API_BASE}/health", timeout=5)
        return _handle_response(r)
    except Exception as e:
        return {"ok": False, "error": str(e)}


@st.cache_data(ttl=300, show_spinner=False)
def get_rules(market: str) -> dict:
    r = requests.get(f"{API_BASE}/rules/{market}", timeout=TIMEOUT)
    return _handle_response(r)


def run_backtest(symbol, market, start, end, expr, upper, lower) -> dict:
    payload = {"symbol": symbol, "market": market, "start": start,
               "end": end, "expr": expr, "upper": upper, "lower": lower}
    r = requests.post(f"{API_BASE}/backtest", json=payload, timeout=TIMEOUT)
    return _handle_response(r)


def run_walk_forward(symbol, market, start, end, expr="ema(close,10)/ema(close,30)-1",
                     train_window=252, test_window=63) -> dict:
    params = {"symbol": symbol, "market": market, "start": start, "end": end,
              "expr": expr, "train_window": train_window, "test_window": test_window}
    r = requests.post(f"{API_BASE}/backtest/walk-forward", params=params, timeout=TIMEOUT * 3)
    return _handle_response(r)


def sweep_parameters(symbol, market, start, end, fast_range, slow_range) -> list:
    params = {"symbol": symbol, "market": market, "start": start,
              "end": end, "fast_range": fast_range, "slow_range": slow_range}
    r = requests.post(f"{API_BASE}/backtest/sweep", params=params, timeout=TIMEOUT * 3)
    return _handle_response(r)


def analyze(symbol, market, start, end) -> dict:
    payload = {"symbol": symbol, "market": market, "start": start, "end": end}
    r = requests.post(f"{API_BASE}/analyze", json=payload, timeout=TIMEOUT * 3)
    return _handle_response(r)


def tw_chips(symbol, start, end) -> list:
    params = {"symbol": symbol, "start": start, "end": end}
    r = requests.post(f"{API_BASE}/factors/tw-chips", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def us_options(symbol) -> dict:
    r = requests.post(f"{API_BASE}/factors/us-options", params={"symbol": symbol}, timeout=TIMEOUT)
    return _handle_response(r)


def qweave_batch(symbol, market, start, end, categories="alpha158") -> dict:
    params = {"symbol": symbol, "market": market, "start": start,
              "end": end, "categories": categories}
    r = requests.post(f"{API_BASE}/factors/qweave/batch", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def inspect_factor(symbol, market, start, end, factor_expr) -> dict:
    params = {"symbol": symbol, "market": market, "start": start,
              "end": end, "factor_expr": factor_expr}
    r = requests.post(f"{API_BASE}/factors/inspect", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def validate_factor(symbol, market, start, end, factor_expr) -> dict:
    params = {"symbol": symbol, "market": market, "start": start,
              "end": end, "factor_expr": factor_expr}
    r = requests.post(f"{API_BASE}/research/validate-factor", params=params, timeout=TIMEOUT * 2)
    return _handle_response(r)


def optimize_portfolio(symbols, market, start, end, method="hrp") -> dict:
    params = {"symbols": symbols, "market": market, "start": start,
              "end": end, "method": method}
    r = requests.post(f"{API_BASE}/portfolio/optimize", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def check_risk(market, symbol, side, qty, price, portfolio_value,
               current_position_value=0.0, current_equity=1_000_000.0) -> dict:
    params = {"market": market, "symbol": symbol, "side": side, "qty": qty,
              "price": price, "portfolio_value": portfolio_value,
              "current_position_value": current_position_value,
              "current_equity": current_equity}
    r = requests.post(f"{API_BASE}/risk/check", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def activate_kill_switch(reason="manual") -> dict:
    r = requests.post(f"{API_BASE}/risk/kill-switch", params={"reason": reason}, timeout=TIMEOUT)
    return _handle_response(r)


def order_protected(symbol, market, side, price, qty, portfolio_value, dry_run=True) -> dict:
    params = {"symbol": symbol, "market": market, "side": side, "price": price,
              "qty": qty, "portfolio_value": portfolio_value, "dry_run": dry_run}
    r = requests.post(f"{API_BASE}/trade/order-protected", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def natural_trade(text, portfolio_value=1_000_000, dry_run=True) -> dict:
    params = {"text": text, "portfolio_value": portfolio_value, "dry_run": dry_run}
    r = requests.post(f"{API_BASE}/trade/natural", params=params, timeout=TIMEOUT)
    return _handle_response(r)


def get_audit_log(limit=100) -> list:
    r = requests.get(f"{API_BASE}/trade/audit-log", params={"limit": limit}, timeout=TIMEOUT)
    return _handle_response(r)

## 1.6 `frontend/utils/charts.py`

```python
"""Plotly 圖表封裝。"""

import numpy as np
import pandas as pd
import plotly.graph_objects as go


LAYOUT_BASE = {
    "template": "plotly_dark",
    "paper_bgcolor": "rgba(0,0,0,0)",
    "plot_bgcolor": "rgba(0,0,0,0)",
    "font": {"color": "#FAFAFA"},
    "margin": {"l": 40, "r": 20, "t": 40, "b": 40},
    "hovermode": "x unified",
}


def equity_curve_chart(equity_curve: list, title: str = "權益曲線") -> go.Figure:
    if not equity_curve:
        return _empty_chart("無數據")
    df = pd.DataFrame(equity_curve)
    if "date" not in df.columns or "equity" not in df.columns:
        return _empty_chart("數據格式錯誤")
    df["date"] = pd.to_datetime(df["date"])

    fig = go.Figure()
    fig.add_trace(go.Scatter(
        x=df["date"], y=df["equity"], mode="lines", name="權益",
        line=dict(color="#00A3A3", width=2),
        fill="tozeroy", fillcolor="rgba(0,163,163,0.1)",
    ))
    fig.update_layout(**LAYOUT_BASE, title=title,
                      xaxis_title="日期", yaxis_title="權益")
    return fig


def price_chart(df: pd.DataFrame, title: str = "價格", market: str = "TW") -> go.Figure:
    if df is None or df.empty:
        return _empty_chart("無數據")
    df = df.copy()
    df["timestamp"] = pd.to_datetime(df["timestamp"])

    up_color = "#FF4B4B" if market == "TW" else "#00C853"
    down_color = "#00C853" if market == "TW" else "#FF4B4B"

    fig = go.Figure(data=[go.Candlestick(
        x=df["timestamp"],
        open=df["open"], high=df["high"], low=df["low"], close=df["close"],
        increasing_line_color=up_color, decreasing_line_color=down_color,
        name="K線",
    )])
    fig.update_layout(**LAYOUT_BASE, title=title,
                      xaxis_title="日期", yaxis_title="價格",
                      xaxis_rangeslider_visible=False)
    return fig


def returns_histogram(equity_curve: list, title: str = "日報酬分佈") -> go.Figure:
    if not equity_curve:
        return _empty_chart("無數據")
    df = pd.DataFrame(equity_curve)
    if "equity" not in df.columns:
        return _empty_chart("無數據")
    returns = df["equity"].pct_change().dropna() * 100

    fig = go.Figure(data=[go.Histogram(x=returns, nbinsx=50, marker_color="#00A3A3")])
    fig.update_layout(**LAYOUT_BASE, title=title,
                      xaxis_title="日報酬 (%)", yaxis_title="頻次")
    return fig


def drawdown_chart(equity_curve: list, title: str = "回撤") -> go.Figure:
    if not equity_curve:
        return _empty_chart("無數據")
    df = pd.DataFrame(equity_curve)
    if "date" not in df.columns or "equity" not in df.columns:
        return _empty_chart("無數據")
    df["date"] = pd.to_datetime(df["date"])
    cum = df["equity"]
    dd = (cum / cum.cummax() - 1) * 100

    fig = go.Figure()
    fig.add_trace(go.Scatter(
        x=df["date"], y=dd, mode="lines", name="回撤",
        line=dict(color="#FF4B4B", width=1.5),
        fill="tozeroy", fillcolor="rgba(255,75,75,0.2)",
    ))
    fig.update_layout(**LAYOUT_BASE, title=title,
                      xaxis_title="日期", yaxis_title="回撤 (%)")
    return fig


def portfolio_weights(weights: dict, title: str = "組合權重") -> go.Figure:
    if not weights:
        return _empty_chart("無數據")
    fig = go.Figure(data=[go.Pie(
        labels=list(weights.keys()), values=list(weights.values()),
        hole=0.5, textinfo="label+percent",
        marker=dict(colors=["#00A3A3", "#FF8C42", "#5B8FF9", "#5AD8A6",
                            "#F6BD16", "#E8684A", "#6DC8EC", "#9270CA"]),
    )])
    fig.update_layout(**LAYOUT_BASE, title=title)
    return fig


def factor_ic_bar(ic_data: list, title: str = "因子 IC") -> go.Figure:
    if not ic_data:
        return _empty_chart("無數據")
    df = pd.DataFrame(ic_data)
    if "factor" not in df.columns or "IC" not in df.columns:
        return _empty_chart("數據格式錯誤")
    df = df.sort_values("IC", ascending=True)
    colors = ["#00C853" if v > 0 else "#FF4B4B" for v in df["IC"]]

    fig = go.Figure(data=[go.Bar(x=df["IC"], y=df["factor"],
                                  orientation="h", marker_color=colors)])
    fig.update_layout(**LAYOUT_BASE, title=title,
                      xaxis_title="IC", yaxis_title="因子")
    return fig


def _empty_chart(message: str) -> go.Figure:
    fig = go.Figure()
    fig.add_annotation(text=message, xref="paper", yref="paper",
                       x=0.5, y=0.5, showarrow=False,
                       font=dict(size=16, color="#888"))
    fig.update_layout(**LAYOUT_BASE)
    fig.update_xaxes(visible=False)
    fig.update_yaxes(visible=False)
    return fig

log_choice = st.selectbox("選擇日誌", ["主審計日誌", "模擬盤審計日誌"])

    st.stop()

    with open(log_path) as f:
        records = [json.loads(line) for line in f if line.strip()]
except Exception as e:
    st.error(f"讀取失敗：{e}")
    st.stop()

st.subheader("🛡️ 完整性驗證")
if st.button("🔍 驗證日誌完整性", type="primary"):
    prev_hash = "0" * 64
    errors = []
    for i, record in enumerate(records):
        if record.get("prev_hash") != prev_hash:
            errors.append({"line": i, "error": "hash chain broken",
                           "expected": prev_hash[:16] + "...",
                           "actual": (record.get("prev_hash") or "")[:16] + "..."})

        actual_hash = record.get("hash")
        check = {k: v for k, v in record.items() if k != "hash"}
        canonical = json.dumps(check, sort_keys=True, default=str)
        expected = hashlib.sha256(canonical.encode()).hexdigest()

        if actual_hash != expected:
            errors.append({"line": i, "error": "hash mismatch",
                           "expected": expected[:16] + "...",
                           "actual": (actual_hash or "")[:16] + "..."})

        prev_hash = actual_hash or prev_hash

    if errors:
        st.error(f"❌ 發現 {len(errors)} 個錯誤")
        st.dataframe(pd.DataFrame(errors), use_container_width=True)
    else:
        st.success(f"✅ 全部 {len(records)} 筆記錄完整無損")
        st.caption(f"最終哈希：`{prev_hash[:32]}...`")

st.divider()
st.subheader("📊 事件類型分佈")

event_types = {}
for r in records:
    et = r.get("event_type", "UNKNOWN")
    event_types[et] = event_types.get(et, 0) + 1

if event_types:
    import plotly.graph_objects as go
    fig = go.Figure(data=[go.Bar(x=list(event_types.keys()),
                                  y=list(event_types.values()),
                                  marker_color="#00A3A3")])
    fig.update_layout(template="plotly_dark", height=300,
                      paper_bgcolor="rgba(0,0,0,0)", plot_bgcolor="rgba(0,0,0,0)",
                      margin=dict(l=40, r=20, t=20, b=40))
    st.plotly_chart(fig, use_container_width=True)

st.divider()
st.subheader("📋 最近記錄")

limit = st.slider("顯示筆數", 10, 200, 50)
records_display = []
for r in records[-limit:][::-1]:
    records_display.append({
        "時間": r.get("timestamp", "")[:19],
        "類型": r.get("event_type", ""),
        "摘要": json.dumps(r.get("data", {}), ensure_ascii=False)[:100],
        "哈希": (r.get("hash") or "")[:16] + "...",
    })

if records_display:
    st.dataframe(pd.DataFrame(records_display), use_container_width=True, hide_index=True)

with st.expander("查看完整記錄"):
    selected_idx = st.number_input("記錄索引（從 0 開始）",
                                    min_value=0, max_value=max(0, len(records) - 1),
                                    value=max(0, len(records) - 1))
    if 0 <= selected_idx < len(records):
        st.json(records[selected_idx])

#!/usr/bin/env python3
"""一鍵灌入台股 + 美股歷史數據。"""

import argparse
import asyncio
import sys
from datetime import datetime
from pathlib import Path

ROOT = Path(__file__).resolve().parent.parent
sys.path.insert(0, str(ROOT))

import pandas as pd

from app.data.composite import CompositeProvider
from app.data.warehouse import MarketWarehouse
from app.domain.models import Market


class IngestStats:
    def __init__(self):
        self.total = 0
        self.success = 0
        self.failed = 0
        self.skipped = 0
        self.total_rows = 0
        self.errors: list[dict] = []

    def add_success(self, symbol, rows, source):
        self.total += 1
        self.success += 1
        self.total_rows += rows

    def add_skip(self, symbol, reason):
        self.total += 1
        self.skipped += 1

    def add_failure(self, symbol, error):
        self.total += 1
        self.failed += 1
        self.errors.append({"symbol": symbol, "error": str(error)})

    def print_summary(self):
        print(f"\n{'=' * 70}")
        print("灌入統計")
        print(f"{'=' * 70}")
        print(f"  總計:     {self.total}")
        print(f"  成功:     {self.success}")
        print(f"  跳過:     {self.skipped}")
        print(f"  失敗:     {self.failed}")
        print(f"  總行數:   {self.total_rows:,}")
        if self.errors:
            print(f"\n失敗明細:")
            for e in self.errors[:10]:
                print(f"  ❌ {e['symbol']}: {e['error'][:100]}")


async def ingest_tw(symbols, start, end, provider, stats, with_chips=False):
    print(f"\n[台股] 準備灌入 {len(symbols)} 檔標的")
    print(f"  時間範圍: {start} → {end}")
    print(f"  籌碼數據: {'開啟' if with_chips else '關閉'}\n")

    for i, sym in enumerate(symbols, 1):
        print(f"  [{i}/{len(symbols)}] {sym} ...", end=" ", flush=True)
        try:
            bars = await provider.get_bars(sym, Market.TW, start, end)
            if bars is None or bars.empty:
                print("無數據")
                stats.add_skip(sym, "no data")
                continue
            print(f"{len(bars):,} 筆 ({bars['timestamp'].iloc[0].date()} → {bars['timestamp'].iloc[-1].date()})")
            stats.add_success(sym, len(bars), "FinMind")

            if with_chips:
                try:
                    from app.factors.tw_chips import TWChipsFactorEngine
                    chip_engine = TWChipsFactorEngine()
                    chips = chip_engine.build_chip_table(sym, start, end)
                    if chips is not None and not chips.empty:
                        print(f"       籌碼 {len(chips):,} 筆")
                except Exception as e:
                    print(f"       籌碼失敗: {e}")
        except Exception as e:
            print(f"失敗: {e}")
            stats.add_failure(sym, e)


async def ingest_us(symbols, start, end, provider, stats):
    print(f"\n[美股] 準備灌入 {len(symbols)} 檔標的")
    print(f"  時間範圍: {start} → {end}\n")

    for i, sym in enumerate(symbols, 1):
        print(f"  [{i}/{len(symbols)}] {sym} ...", end=" ", flush=True)
        try:
            bars = await provider.get_bars(sym, Market.US, start, end)
            if bars is None or bars.empty:
                print("無數據")
                stats.add_skip(sym, "no data")
                continue
            print(f"{len(bars):,} 筆 ({bars['timestamp'].iloc[0].date()} → {bars['timestamp'].iloc[-1].date()})")
            stats.add_success(sym, len(bars), "yfinance")
        except Exception as e:
            print(f"失敗: {e}")
            stats.add_failure(sym, e)


def verify_warehouse(warehouse):
    print(f"\n{'=' * 70}")
    print("數據倉庫驗證")
    print(f"{'=' * 70}")
    try:
        with warehouse._conn() as con:
            bars_stats = con.execute("""
                SELECT market, COUNT(DISTINCT symbol) AS symbols, COUNT(*) AS rows,
                       MIN(timestamp) AS min_date, MAX(timestamp) AS max_date
                FROM bars GROUP BY market ORDER BY market
            """).df()
            if not bars_stats.empty:
                print("\nbars 表:")
                print(bars_stats.to_string(index=False))
    except Exception as e:
        print(f"驗證失敗: {e}")


def parse_args():
    parser = argparse.ArgumentParser(description="一鍵灌入歷史數據")
    parser.add_argument("--market", type=str, default="TW", choices=["TW", "US", "BOTH"])
    parser.add_argument("--symbols", type=str, default=None)
    parser.add_argument("--tw-symbols", type=str, default=None)
    parser.add_argument("--us-symbols", type=str, default=None)
    parser.add_argument("--start", type=str, default="2020-01-01")
    parser.add_argument("--end", type=str, default=None)
    parser.add_argument("--with-chips", action="store_true")
    return parser.parse_args()


async def main():
    args = parse_args()
    if args.end is None:
        args.end = datetime.now().strftime("%Y-%m-%d")

    if args.market == "BOTH":
        tw_symbols = [s.strip() for s in (args.tw_symbols or "2330").split(",") if s.strip()]
        us_symbols = [s.strip() for s in (args.us_symbols or "AAPL").split(",") if s.strip()]
    else:
        symbols_arg = args.symbols or ("2330" if args.market == "TW" else "AAPL")
        symbols = [s.strip() for s in symbols_arg.split(",") if s.strip()]
        if args.market == "TW":
            tw_symbols, us_symbols = symbols, []
        else:
            tw_symbols, us_symbols = [], symbols

    print(f"\n{'=' * 70}")
    print("數據灌入")
    print(f"{'=' * 70}")
    print(f"  市場: {args.market}")
    print(f"  台股: {len(tw_symbols)} 檔 · 美股: {len(us_symbols)} 檔")
    print(f"  時間: {args.start} → {args.end}")

    provider = CompositeProvider()
    warehouse = MarketWarehouse()
    stats = IngestStats()
    t0 = datetime.now()

    if tw_symbols:
        await ingest_tw(tw_symbols, args.start, args.end, provider, stats, args.with_chips)
    if us_symbols:
        await ingest_us(us_symbols, args.start, args.end, provider, stats)

    elapsed = (datetime.now() - t0).total_seconds()
    stats.print_summary()
    print(f"  耗時: {elapsed:.1f} 秒")
    verify_warehouse(warehouse)

    print(f"\n{'=' * 70}")
    print("✅ 灌入完成" if stats.failed == 0 else f"⚠️  有 {stats.failed} 筆失敗")
    print(f"{'=' * 70}\n")


if __name__ == "__main__":
    asyncio.run(main())

## 2.3 `scripts/run_first_backtest.py`

**職責**：一鍵跑第一次回測，生成 Markdown + JSON 報告。

```python
#!/usr/bin/env python3
"""一鍵跑第一次回測並輸出報告。"""

import argparse
import asyncio
import json
import sys
from datetime import datetime
from pathlib import Path

ROOT = Path(__file__).resolve().parent.parent
sys.path.insert(0, str(ROOT))

import numpy as np
import pandas as pd

from app.backtest.engine import BacktestEngine
from app.backtest.signal_dsl import SignalDSL
from app.backtest.walk_forward import WalkForwardEngine
from app.data.composite import CompositeProvider
from app.domain.models import Market
from app.risk.guard import build_tw_guard, build_us_guard


PRESET_STRATEGIES = {
    "ma_cross_10_30": {"name": "MA 交叉 (10/30)",
                       "expr": "ema(close, 10) / ema(close, 30) - 1",
                       "upper": 0.02, "lower": -0.02},
    "ma_cross_5_20": {"name": "MA 交叉 (5/20)",
                      "expr": "ema(close, 5) / ema(close, 20) - 1",
                      "upper": 0.01, "lower": -0.01},
    "rsi_14": {"name": "RSI(14) 超買超賣",
               "expr": "rsi(close, 14) - 50",
               "upper": 20, "lower": -20},
    "bollinger": {"name": "布林帶回歸",
                  "expr": "zscore(close, 20)",
                  "upper": 1.5, "lower": -1.5},
    "momentum_20": {"name": "20 日動量",
                    "expr": "close / delay(close, 20) - 1",
                    "upper": 0.05, "lower": -0.05},
}


def compute_metrics(result, bars):
    eq_df = pd.DataFrame(result.get("equity_curve", []))
    if eq_df.empty:
        return {}
    eq_df["return"] = eq_df["equity"].pct_change().fillna(0)
    total_return = float(eq_df["equity"].iloc[-1] / eq_df["equity"].iloc[0] - 1)
    sharpe = float(eq_df["return"].mean() / (eq_df["return"].std() + 1e-9) * (252 ** 0.5))
    cum = eq_df["equity"]
    max_dd = float(((cum / cum.cummax()) - 1).min())
    downside = eq_df["return"][eq_df["return"] < 0]
    sortino = float(eq_df["return"].mean() / (downside.std() + 1e-9) * (252 ** 0.5))
    calmar = float(total_return / (abs(max_dd) + 1e-9))
    annual_vol = float(eq_df["return"].std() * (252 ** 0.5))

    trades = result.get("trades", [])
    wins, losses, buy_stack = 0, 0, []
    holding_days = []
    for t in trades:
        if t["side"] == "BUY":
            buy_stack.append(t)
        elif t["side"] == "SELL" and buy_stack:
            buy = buy_stack.pop(0)
            pnl = (t["price"] - buy["price"]) * t["qty"] - t.get("fee", 0) - buy.get("fee", 0)
            if pnl > 0:
                wins += 1
            else:
                losses += 1
            try:
                days = (pd.Timestamp(t["date"]) - pd.Timestamp(buy["date"])).days
                holding_days.append(days)
            except Exception:
                pass

    win_rate = wins / (wins + losses) if (wins + losses) > 0 else 0.0
    avg_hold = float(np.mean(holding_days)) if holding_days else 0.0

    return {
        "total_return": round(total_return, 4),
        "sharpe": round(sharpe, 4),
        "sortino": round(sortino, 4),
        "calmar": round(calmar, 4),
        "max_drawdown": round(max_dd, 4),
        "annual_volatility": round(annual_vol, 4),
        "num_trades": len(trades),
        "win_rate": round(win_rate, 4),
        "avg_holding_days": round(avg_hold, 2),
        "final_equity": round(float(eq_df["equity"].iloc[-1]), 2),
        "initial_equity": round(float(eq_df["equity"].iloc[0]), 2),
    }


async def run_single_backtest(data_provider, symbol, market, start, end, strategy,
                              use_risk_guard=False):
    bars = await data_provider.get_bars(symbol, market, start, end)
    if bars is None or bars.empty:
        return {"error": "no data", "symbol": symbol, "market": market.value}
    if len(bars) < 60:
        return {"error": f"insufficient data ({len(bars)} bars)", "symbol": symbol}

    dsl = SignalDSL(bars)
    score = dsl.evaluate(strategy["expr"])
    signals = dsl.discretize(score, strategy["upper"], strategy["lower"])

    risk_guard = None
    if use_risk_guard:
        risk_guard = build_tw_guard() if market == Market.TW else build_us_guard()

    engine = BacktestEngine(market=market, initial_cash=1_000_000.0,
                             slippage_pct=0.001, risk_guard=risk_guard)
    result = engine.run(bars, signals)
    metrics = compute_metrics(result, bars)

    return {
        "symbol": symbol, "market": market.value,
        "strategy": strategy["name"], "expr": strategy["expr"],
        "period": f"{bars['timestamp'].iloc[0].date()} → {bars['timestamp'].iloc[-1].date()}",
        "bars_count": len(bars), "metrics": metrics,
        "trades": result.get("trades", [])[:20],
        "equity_curve": result.get("equity_curve", [])[-100:],
    }


async def run_walk_forward(data_provider, symbol, market, start, end, strategy):
    bars = await data_provider.get_bars(symbol, market, start, end)
    if bars is None or bars.empty or len(bars) < 252 + 63:
        return {"error": "insufficient data"}

    def signal_fn(train_df):
        def gen(test_df):
            dsl = SignalDSL(test_df)
            score = dsl.evaluate(strategy["expr"])
            return dsl.discretize(score, strategy["upper"], strategy["lower"])
        return gen

    def bt(b, s):
        engine = BacktestEngine(market=market, initial_cash=1_000_000.0)
        return engine.run(b, s)

    wf = WalkForwardEngine(train_window=252, test_window=63, step=63)
    result = wf.walk_forward(bars, signal_fn, bt)
    return {"symbol": symbol, "strategy": strategy["name"],
            "summary": result.get("summary", {})}


def generate_markdown_report(results, wf_result, args):
    lines = [f"# 回測報告\n", f"**生成時間**：{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n"]
    lines.append("## 一、基本資訊\n")
    lines.append(f"- **標的**：{args.symbol} · **市場**：{args.market}")
    lines.append(f"- **時間範圍**：{args.start} → {args.end}")
    lines.append("")

    lines.append("## 二、策略績效對比\n")
    lines.append("| 策略 | 總報酬 | Sharpe | Sortino | 最大回撤 | 交易數 | 勝率 |")
    lines.append("|------|--------|--------|---------|----------|--------|------|")
    for r in results:
        if "error" in r:
            lines.append(f"| {r.get('strategy', 'N/A')} | ERR | - | - | - | - | - |")
            continue
        m = r.get("metrics", {})
        lines.append(f"| {r['strategy']} | {m.get('total_return', 0):+.2%} | "
                     f"{m.get('sharpe', 0):.2f} | {m.get('sortino', 0):.2f} | "
                     f"{m.get('max_drawdown', 0):.2%} | {m.get('num_trades', 0)} | "
                     f"{m.get('win_rate', 0):.1%} |")
    lines.append("")

    if wf_result and "summary" in wf_result:
        s = wf_result["summary"]
        lines.append("## 三、Walk-Forward 驗證\n")
        lines.append(f"| 指標 | 數值 |")
        lines.append(f"|------|------|")
        lines.append(f"| 窗口數 | {s.get('num_windows', 0)} |")
        lines.append(f"| Sharpe 均值 | {s.get('sharpe_mean', 0):.4f} |")
        lines.append(f"| **OOS 一致性** | **{s.get('oos_consistency', 0):.4f}** |")
        lines.append("")

    lines.append("---\n")
    lines.append("**免責聲明**：本報告僅供研究參考，不構成投資建議。")
    return "\n".join(lines)


def parse_args():
    parser = argparse.ArgumentParser(description="一鍵跑第一次回測")
    parser.add_argument("--symbol", type=str, default="2330")
    parser.add_argument("--market", type=str, default="TW", choices=["TW", "US"])
    parser.add_argument("--start", type=str, default="2022-01-01")
    parser.add_argument("--end", type=str, default=None)
    parser.add_argument("--multi", action="store_true")
    parser.add_argument("--expr", type=str, default=None)
    parser.add_argument("--upper", type=float, default=0.02)
    parser.add_argument("--lower", type=float, default=-0.02)
    parser.add_argument("--walk-forward", action="store_true")
    parser.add_argument("--risk-guard", action="store_true")
    return parser.parse_args()


async def main():
    args = parse_args()
    if args.end is None:
        args.end = datetime.now().strftime("%Y-%m-%d")

    market = Market(args.market)
    data_provider = CompositeProvider()

    print(f"\n{'=' * 70}")
    print(f"回測：{args.symbol} ({args.market}) {args.start} → {args.end}")
    print(f"{'=' * 70}\n")

    if args.expr:
        strategies = [{"name": "自訂策略", "expr": args.expr,
                       "upper": args.upper, "lower": args.lower}]
    elif args.multi:
        strategies = list(PRESET_STRATEGIES.values())
    else:
        strategies = [PRESET_STRATEGIES["ma_cross_10_30"]]

    results = []
    for i, strat in enumerate(strategies, 1):
        print(f"[{i}/{len(strategies)}] {strat['name']} ...")
        result = await run_single_backtest(data_provider, args.symbol, market,
                                            args.start, args.end, strat, args.risk_guard)
        results.append(result)
        if "error" in result:
            print(f"    ❌ {result['error']}")
        else:
            m = result["metrics"]
            print(f"    Sharpe={m['sharpe']:.2f}  Return={m['total_return']:+.2%}  "
                  f"MDD={m['max_drawdown']:.2%}  Trades={m['num_trades']}")

    wf_result = None
    if args.walk_forward and results and "error" not in results[0]:
        print(f"\n跑 Walk-Forward 驗證...")
        wf_result = await run_walk_forward(data_provider, args.symbol, market,
                                            args.start, args.end, strategies[0])
        if "summary" in wf_result:
            print(f"    OOS 一致性: {wf_result['summary'].get('oos_consistency', 0):.4f}")

    md_report = generate_markdown_report(results, wf_result, args)
    md_path = ROOT / "reports" / f"backtest_{args.symbol}_{datetime.now().strftime('%Y%m%d_%H%M%S')}.md"
    md_path.parent.mkdir(parents=True, exist_ok=True)
    with open(md_path, "w", encoding="utf-8") as f:
        f.write(md_report)

    json_path = md_path.with_suffix(".json")
    with open(json_path, "w", encoding="utf-8") as f:
        json.dump({"generated_at": datetime.now().isoformat(),
                   "args": vars(args), "results": results, "walk_forward": wf_result},
                  f, indent=2, ensure_ascii=False, default=str)

    print(f"\n{'=' * 70}")
    print(f"報告已生成：\n  Markdown: {md_path}\n  JSON: {json_path}")
    print(f"{'=' * 70}\n")


if __name__ == "__main__":
    asyncio.run(main())
```
